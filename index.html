<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI on HPC Workshop Series (AIonHPC)</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
</head>
<body class="bg-light">

  <!-- ======================== HERO ======================== -->
  <header class="container py-5 text-center">
    <h1 class="display-4 fw-bold mb-3">AI on HPC Workshop Series</h1>
    <p class="text-secondary fs-5 mb-0">
      Performance Engineering, Challenges and Opportunities
    </p>
  </header>

  <!-- ======================== EVENTS GRID ======================== -->
  <section class="container py-4">
    <h2 class="fs-4 fw-bold text-uppercase text-secondary mb-4 text-center">
      Upcoming Events
    </h2>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">

      <!-- Event 1 — Active -->
      <div class="col">
        <div class="card h-100 border-0 shadow-sm rounded overflow-hidden">
          <div class="p-2 text-center" style="background: rgba(0,0,0,0.85);">
            <p class="text-white fw-bold small mb-0">in conjunction with:</p>
          </div>
          <img src="img/2026_SC_logo.png"
               class="img-fluid w-100"
               style="aspect-ratio: 1 / 1; object-fit: contain; background: #f8f9fa;"
               alt="SuperComputing 2026">
          <div class="card-body text-center bg-white">
            <p class="card-text text-secondary small mb-0">Upcoming</p>
          </div>
        </div>
      </div>

      <!-- Event 2 — Grayed out / Past -->
      <div class="col">
        <div class="card h-100 border-0 shadow-sm rounded overflow-hidden opacity-50">
          <div class="p-2 text-center" style="background: rgba(0,0,0,0.85);">
            <p class="text-white fw-bold small mb-0">in conjunction with:</p>
          </div>
          <img src="img/2026_ISC_logo.png"
               class="img-fluid w-100"
               style="aspect-ratio: 1 / 1; object-fit: contain; background: #f8f9fa; filter: grayscale(100%);"
               alt="International SuperComputing 2026">
          <div class="card-body text-center bg-white">
            <p class="card-text text-secondary small mb-0">Past Event</p>
          </div>
        </div>
      </div>

    </div>
  </section>

  <!-- ======================== GALLERY ======================== -->
  <section class="container py-5">
    <h2 class="fs-4 fw-bold text-uppercase text-secondary mb-4 text-center">
      Past Events Gallery
    </h2>

    <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3">

      <div class="col position-relative overflow-hidden rounded shadow-sm">
        <img src="img/2026_ISC_01.jpg"
             class="img-fluid w-100"
             style="aspect-ratio: 1 / 1; object-fit: cover;"
             alt="AI on HPC at ISC 2026 Hamburg">
      </div>

      <div class="col position-relative overflow-hidden rounded shadow-sm">
        <img src="img/2026_ISC_02.jpg"
             class="img-fluid w-100"
             style="aspect-ratio: 1 / 1; object-fit: cover;"
             alt="AI on HPC at ISC 2026 Hamburg">
      </div>

      <div class="col position-relative overflow-hidden rounded shadow-sm">
        <img src="img/2026_ISC_03.jpg"
             class="img-fluid w-100"
             style="aspect-ratio: 1 / 1; object-fit: cover;"
             alt="AI on HPC at ISC 2026 Hamburg">
      </div>

      <div class="col position-relative overflow-hidden rounded shadow-sm">
        <img src="img/2026_ISC_04.jpg"
             class="img-fluid w-100"
             style="aspect-ratio: 1 / 1; object-fit: cover;"
             alt="AI on HPC at ISC 2026 Hamburg">
      </div>

    </div>
  </section>

  <!-- ======================== FOOTER ======================== -->
  <footer class="bg-white border-top mt-5">
    <div class="container py-4 text-center">
      <p class="text-secondary small mb-2">
        AI on HPC Workshop Series (AIonHPC)
      </p>
      <a href="https://www.linkedin.com/company/isc-workshop-ai-on-hpc"
         class="btn btn-sm btn-outline-dark"
         target="_blank">Follow on LinkedIn</a>
    </div>
  </footer>

</body>
</html>
